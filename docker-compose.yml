version: '3.8'

services:
  sparkx-app:
    build: .
    container_name: sparkx-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    volumes:
      # Keep uploaded/puzzle images persistent if needed
      - ./public/puzzles:/app/public/puzzles
